<style>
/* ==========  ARF  design tokens  ========== */
:root{
  --navy:#0a1633; --navy-2:#102250; --navy-3:#1a3270;
  --gold:#f5b83d; --amber:#e8a317; --amber-ink:#8a5a00;
  --bg:#f5f7fb; --white:#fff; --ink:#0d1b3d; --muted:#51607f; --line:#dde3ef;
  --r:16px; --ease:cubic-bezier(.22,.7,.2,1);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --head:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--head) + 8px)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--gold);color:var(--navy);padding:8px 14px;border-radius:10px;z-index:100;font-weight:700}
.skip:focus{top:10px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
h1,h2,h3{line-height:1.15;letter-spacing:-.01em;color:var(--navy)}
h1{font-size:clamp(2rem,7vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.45rem,4.4vw,2.1rem);font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--amber-ink)}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--amber);border-radius:2px}
.dark .eyebrow{color:var(--gold)} .dark h1,.dark h2,.dark h3{color:#fff} .dark p{color:#b9c4e0}

/* ==========  buttons: compact, 44px touch hit-area  ========== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;font-size:.88rem;font-weight:700;line-height:1;white-space:nowrap;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s;-webkit-tap-highlight-color:transparent}
.btn::after{content:"";position:absolute;inset:-4px -2px}
.btn svg{width:16px;height:16px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--amber));color:var(--navy);box-shadow:0 6px 16px -6px rgba(232,163,23,.7)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 10px 20px -6px rgba(232,163,23,.8)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{transform:translateY(-2px);background:var(--navy-2)}
.btn-ghost{border:1.5px solid var(--navy);color:var(--navy)}
.btn-ghost:hover{background:var(--navy);color:#fff;transform:translateY(-2px)}
.dark .btn-ghost{border-color:rgba(255,255,255,.4);color:#fff}
.dark .btn-ghost:hover{background:#fff;color:var(--navy)}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn.off{opacity:.55;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ==========  header + menu overlay  ========== */
header.top{position:fixed;inset:0 0 auto 0;height:var(--head);z-index:60;display:flex;align-items:center;background:rgba(245,247,251,.82);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(13,27,61,.06);transition:background .3s,border-color .3s}
header.top .wrap{display:flex;align-items:center;justify-content:space-between}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.2em;font-size:1.05rem;color:var(--navy);min-height:44px}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--navy);box-shadow:0 4px 12px -4px rgba(10,22,51,.6)}
.logo i svg{width:18px;height:18px}
.burger{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.burger span{position:absolute;left:12px;width:20px;height:2px;border-radius:2px;background:var(--navy);transition:transform .35s var(--ease),opacity .2s,background .3s}
.burger span:nth-child(1){top:16px}.burger span:nth-child(2){top:21px;width:14px;left:18px}.burger span:nth-child(3){top:26px}
body.menu-open .burger span{background:#fff}
body.menu-open .burger span:nth-child(1){transform:translateY(5px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
body.menu-open header.top{background:transparent;border-color:transparent}
body.menu-open .logo{color:#fff} body.menu-open .logo i{background:rgba(255,255,255,.12)}
#menu{position:fixed;inset:0;z-index:55;background:radial-gradient(120% 80% at 80% 0%,#1a3270 0%,#0a1633 60%);display:flex;flex-direction:column;justify-content:center;padding:calc(var(--head) + 10px) 28px 28px;opacity:0;visibility:hidden;transform:scale(1.03);transition:opacity .35s var(--ease),transform .45s var(--ease),visibility 0s .45s}
body.menu-open #menu{opacity:1;visibility:visible;transform:none;transition-delay:0s}
#menu .inner{width:min(520px,100%);margin-inline:auto}
#menu ul{list-style:none}
#menu li{opacity:0;transform:translateY(14px);transition:opacity .4s var(--ease),transform .5s var(--ease)}
body.menu-open #menu li{opacity:1;transform:none}
#menu li:nth-child(1){transition-delay:.06s}#menu li:nth-child(2){transition-delay:.1s}#menu li:nth-child(3){transition-delay:.14s}#menu li:nth-child(4){transition-delay:.18s}#menu li:nth-child(5){transition-delay:.22s}#menu li:nth-child(6){transition-delay:.26s}
#menu a{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:6px 4px;font-size:clamp(1.25rem,5vw,1.6rem);font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.1);transition:color .2s,padding .3s var(--ease)}
#menu a small{font-size:.7rem;font-weight:700;color:var(--gold);letter-spacing:.14em}
#menu a:hover,#menu a[aria-current=page]{color:var(--gold);padding-left:10px}
#menu a svg{width:18px;height:18px;color:var(--gold)}
#menu .note{margin-top:22px;font-size:.78rem;color:#8fa0c8}
.orb-menu{position:absolute;right:-60px;bottom:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd77a,#e8a317 55%,transparent 72%);opacity:.22;pointer-events:none}

/* ==========  3D / anti-gravity primitives  ========== */
.stage{perspective:1000px}
.float{position:absolute;pointer-events:none;will-change:transform}
.float>i{display:block;width:100%;height:100%;animation:bob var(--d,7s) ease-in-out infinite;animation-delay:var(--dl,0s);will-change:transform}
@keyframes bob{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(0,-16px,0) rotate(4deg)}}
.o-gold{border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffe3a0,#f5b83d 45%,#c98505 100%);box-shadow:0 18px 30px -12px rgba(232,163,23,.65)}
.o-gold>i{border-radius:50%}
.o-navy{border-radius:50%;background:radial-gradient(circle at 32% 28%,#4466b8,#102250 60%,#0a1633);box-shadow:0 20px 34px -14px rgba(10,22,51,.7)}
.o-navy>i{border-radius:50%}
.o-ring{border-radius:50%;border:2px solid rgba(232,163,23,.7)}
.o-ring>i{border-radius:50%}
.o-glass{border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.7);box-shadow:0 20px 40px -20px rgba(10,22,51,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.o-glass>i{border-radius:18px}
.rv{opacity:0;transform:translate3d(0,22px,0);transition:opacity .7s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
[data-tilt]{transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.glass{position:relative;border-radius:var(--r);background:linear-gradient(150deg,rgba(26,50,112,.85),rgba(10,22,51,.92));border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 44px -24px rgba(10,22,51,.8),inset 0 1px 0 rgba(255,255,255,.12);color:#fff}
.glass p{color:#b9c4e0}
.glass h3,.glass h2{color:#fff}
.card{position:relative;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:0 18px 34px -24px rgba(10,22,51,.35)}

/* ==========  sections  ========== */
main{padding-top:var(--head);min-height:70vh;outline:0}
.view{animation:fadein .45s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{position:relative;padding:48px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.sec-head h2{margin-top:6px}
.dark{background:linear-gradient(180deg,var(--navy) 0%,#0c1b42 100%);color:#fff;overflow:hidden}
.tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(245,184,61,.16);color:var(--amber-ink)}
.dark .tag,.glass .tag{background:rgba(245,184,61,.18);color:var(--gold)}
.sample{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:6px;background:rgba(10,22,51,.07);color:var(--muted)}
.dark .sample,.glass .sample{background:rgba(255,255,255,.1);color:#9fb0d9}

/* hero */
.hero{padding:26px 0 40px;overflow:hidden;background:radial-gradient(90% 60% at 85% 0%,rgba(245,184,61,.18),transparent 60%),radial-gradient(70% 50% at 0% 30%,rgba(26,50,112,.1),transparent 60%)}
.hero .wrap{display:grid;gap:22px;position:relative}
.hero-copy{position:relative;z-index:2}
.hero-copy h1{margin:10px 0 8px}
.hero-copy h1 em{font-style:normal;background:linear-gradient(120deg,var(--amber),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy p{max-width:44ch;margin-bottom:16px}
.slider-box{position:relative;width:min(100%,360px);margin-inline:auto;z-index:2}
.slider{position:relative;aspect-ratio:3/4;border-radius:24px;overflow:hidden;background:var(--navy);box-shadow:0 36px 60px -30px rgba(10,22,51,.8),0 0 0 1px rgba(255,255,255,.4) inset;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline-offset:4px;transform:translateZ(0)}
.track{display:flex;height:100%;transition:transform .65s var(--ease);will-change:transform}
.slider.dragging .track{transition:none}
.slide{position:relative;flex:0 0 100%;height:100%}
.slide svg,.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.slide .slot{position:absolute;top:12px;left:12px}
.slider-over{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;display:block;color:#fff;background:linear-gradient(to top,rgba(10,22,51,.55),rgba(10,22,51,0));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to top,#000 62%,transparent);mask-image:linear-gradient(to top,#000 62%,transparent);z-index:3}
.slider-over b{display:flex;align-items:center;gap:8px;font-size:1.25rem;letter-spacing:.06em;font-weight:900}
.slider-over b svg{width:17px;height:17px;color:var(--gold)}
.slider-over span{display:block;font-size:.84rem;color:#e7ecfa;margin-top:2px;padding-bottom:20px}
.slider-over:hover b{color:var(--gold)}
.sl-ctl{position:absolute;left:0;right:0;bottom:12px;z-index:4;display:flex;justify-content:center;align-items:center;gap:2px;pointer-events:none}
.sl-ctl>*{pointer-events:auto}
.dot{width:22px;height:22px;display:grid;place-items:center}
.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);transition:width .3s var(--ease),background .3s}
.dot[aria-current=true]::before{width:20px;border-radius:4px;background:var(--gold)}
.pp{width:26px;height:26px;display:grid;place-items:center;margin-left:6px;color:#fff;opacity:.8;border-radius:50%}
.pp svg{width:12px;height:12px}
.arrow{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;display:none;place-items:center;z-index:4;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .2s,transform .2s}
.arrow:hover{background:rgba(255,255,255,.4);transform:scale(1.06)}
.arrow svg{width:16px;height:16px}.arrow.l{left:10px}.arrow.r{right:10px}
@media(hover:hover){.arrow{display:grid}}

/* bio */
.bio{padding:22px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 26px 40px -30px rgba(10,22,51,.4);position:relative;overflow:hidden}
.bio::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--gold),var(--amber))}
.bio p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 14px}
.bio.open p{-webkit-line-clamp:unset;display:block}
.bio .more{display:none;margin-top:-4px;margin-bottom:14px}
.bio.open .more{display:block}
.link-cards{display:grid;gap:14px;margin-top:18px}
.lcard{display:block;padding:20px;min-height:150px}
.lcard .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--amber));color:var(--navy);margin-bottom:14px;transform:translateZ(30px)}
.lcard .ic svg{width:22px;height:22px}
.lcard h3{color:#fff;transform:translateZ(20px)}
.lcard p{font-size:.9rem;margin:4px 0 12px}
.lcard .go{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--gold)}
.lcard .go svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.lcard:hover .go svg{transform:translateX(4px)}

/* books rail */
.rail-wrap{position:relative}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:14px 16px 26px;margin:0 -16px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;perspective:1000px}
.rail::-webkit-scrollbar{display:none}
.rail{scroll-padding-inline:16px}
.rail.grab{scroll-snap-type:none;cursor:grabbing;user-select:none}
.book-card[data-tilt]{transform-style:flat}
.book-card{flex:0 0 min(224px,70vw);scroll-snap-align:start;padding:18px 16px 16px;text-align:left}
.book{position:relative;width:128px;height:178px;margin:6px auto 20px;transform-style:preserve-3d;transform:perspective(600px) rotateY(-24deg) rotateX(4deg);transition:transform .6s var(--ease)}
.book-card:hover .book,.book-card:focus-within .book{transform:perspective(600px) rotateY(-6deg) rotateX(0) translateY(-6px)}
.book .face{position:absolute;inset:0;border-radius:3px 8px 8px 3px;padding:14px 12px;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;color:#fff;box-shadow:0 22px 24px -14px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.28);overflow:hidden}
.book .face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12))}
.book .face::after{content:"";position:absolute;right:-26px;bottom:-26px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffe3a0,#f5b83d 55%,#c98505);opacity:.9}
.book .t{font-weight:800;font-size:.92rem;line-height:1.15;position:relative;z-index:1;padding-left:6px}
.book .a{font-size:.58rem;letter-spacing:.18em;font-weight:700;opacity:.85;position:relative;z-index:1;padding-left:6px}
.book-card h3{color:#fff;font-size:.98rem}
.book-card p{font-size:.82rem;margin:4px 0 12px}
.rail-ctl{display:flex;gap:8px;align-items:center}
.rbtn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.3);color:#fff;transition:background .2s,transform .2s}
.rbtn::after{content:"";position:absolute;inset:-3px}
.rbtn:hover{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.rbtn svg{width:16px;height:16px}
.hint{font-size:.78rem;color:#8fa0c8;margin-top:-6px}

/* blogs */
.grid{display:grid;gap:14px}
.post{display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .3s}
.post .thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--navy)}
.post .thumb svg{width:100%;height:100%;transition:transform .8s var(--ease)}
.post:hover .thumb svg{transform:scale(1.06)}
.post .body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.post .meta{display:flex;gap:8px;align-items:center;font-size:.74rem;color:var(--muted)}
.post h3{font-size:1.02rem}
.post p{font-size:.88rem}
.post .go{margin-top:auto;padding-top:6px;font-weight:700;font-size:.84rem;color:var(--amber-ink);display:inline-flex;gap:6px;align-items:center}
.post .go svg{width:14px;height:14px}

/* generic pages */
.page-hero{padding:40px 0 30px;position:relative;overflow:hidden}
.page-hero h1{margin:10px 0 10px}
.page-hero p{max-width:60ch}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--muted);min-height:44px}
.back svg{width:14px;height:14px;transform:rotate(180deg)}
.two{display:grid;gap:22px}
.prose{max-width:70ch}
.prose h2{font-size:1.25rem;margin:28px 0 8px}
.prose p,.prose li{margin-bottom:10px;color:#3d4c6e}
.prose ul{padding-left:20px}
.tile{padding:18px}
.tile .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:rgba(245,184,61,.2);color:var(--amber-ink);margin-bottom:10px}
.tile .ic svg{width:20px;height:20px}
.tile p{font-size:.9rem}
.list{list-style:none;display:grid;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start;color:#3d4c6e;font-size:.94rem}
.list li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--amber))}
.dark .list li{color:#c9d3ec}
.mock{aspect-ratio:16/10;background:#e9eef8;border-bottom:1px solid var(--line);position:relative}
.mock svg{width:100%;height:100%}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:7px 12px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink)}
.dark .pill{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
.steps{counter-reset:s;display:grid;gap:12px}
.steps .tile{padding-left:62px;position:relative}
.steps .tile::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:16px;width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--navy);color:var(--gold);font-weight:800}

/* social */
.soc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.soc a{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px}
.soc .i{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:rgba(245,184,61,.16);color:var(--gold)}
.soc svg{width:19px;height:19px}
.soc b{display:block;font-size:.88rem;color:#fff;overflow:hidden;text-overflow:ellipsis}.soc small{display:block;font-size:.72rem;color:#9fb0d9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* ---------- hero slider artwork (placeholder portraits) ---------- */
function slideArt(i){
  const a=[["#1a3270","#0a1633"],["#7a4b00","#0a1633"],["#0f3a6b","#0a1633"],["#2a2a7a","#0a1633"]][i%4];
  const sx=[150,138,162,150][i%4];
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder portrait artwork">
  <defs>
    <linearGradient id="bg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a[0]}"/><stop offset="1" stop-color="${a[1]}"/></linearGradient>
    <radialGradient id="gl${i}" cx=".3" cy=".25" r=".8"><stop offset="0" stop-color="#ffe3a0"/><stop offset=".5" stop-color="#f5b83d"/><stop offset="1" stop-color="#c98505"/></radialGradient>
    <linearGradient id="sh${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a5aa8" stop-opacity=".95"/><stop offset="1" stop-color="#0a1633" stop-opacity=".95"/></linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg${i})"/>
  <g stroke="#fff" stroke-opacity=".06">${Array.from({length:8},(_,k)=>`<path d="M0 ${k*55}H300"/><path d="M${k*45} 0V400"/>`).join("")}</g>
  <circle cx="${70+i*40}" cy="${90+(i%2)*30}" r="${44+i*5}" fill="url(#gl${i})" opacity=".95"/>
  <circle cx="${70+i*40}" cy="${90+(i%2)*30}" r="${78+i*6}" fill="none" stroke="#f5b83d" stroke-opacity=".4"/>
  <circle cx="${260-i*35}" cy="${300-i*20}" r="${110}" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="22"/>
  <path d="M${sx-118} 410C${sx-118} 300 ${sx-70} 262 ${sx} 262S${sx+118} 300 ${sx+118} 410z" fill="url(#sh${i})"/>
  <path d="M${sx-26} 262l26 44 26-44" fill="none" stroke="#f5b83d" stroke-width="3" stroke-linejoin="round" opacity=".9"/>
  <rect x="${sx-14}" y="222" width="28" height="44" rx="12" fill="#2a4a9a"/>
  <ellipse cx="${sx}" cy="190" rx="44" ry="54" fill="#2f4f9c"/>
  <path d="M${sx-44} 182C${sx-44} 140 ${sx-14} 130 ${sx+10} 132 ${sx+36} 134 ${sx+46} 156 ${sx+44} 182 ${sx+30} 160 ${sx} 154 ${sx-44} 182z" fill="#0a1633"/>
  <path d="M${sx+42} 160C${sx+50} 190 ${sx+40} 230 ${sx+20} 240" fill="none" stroke="#f5b83d" stroke-opacity=".7" stroke-width="2.500"/>
  <circle cx="${40+i*50}" cy="${360-i*10}" r="5" fill="#f5b83d"/><circle cx="${250-i*30}" cy="150" r="3.500" fill="#fff" opacity=".7"/>
  </svg>`;
}
function sliderHTML(){
  const slides = IMAGES.map((im,i)=>`<div class="slide" role="group" aria-roledescription="slide" aria-label="${i+1} of ${IMAGES.length}">${
    im.src ? `<img src="${im.src}" alt="${im.alt||""}" ${i?'loading="lazy"':'fetchpriority="high"'} decoding="async">` : slideArt(i)
  }${(!im.src && SHOW_SAMPLE_TAGS)?`<span class="sample slot" style="background:rgba(255,255,255,.14);color:#e7ecfa">PHOTO SLOT ${i+1}</span>`:""}</div>`).join("");
  const dots = IMAGES.map((_,i)=>`<button class="dot" aria-label="Go to slide ${i+1}" ${i?"":'aria-current="true"'}></button>`).join("");
  return `<div class="slider-box stage" data-depth="0">
    <div class="float o-gold" style="width:46px;height:46px;left:-14px;top:12%;z-index:5"><i style="--d:6s"></i></div>
    <div class="float o-ring" style="width:84px;height:84px;right:-22px;bottom:22%;z-index:5"><i style="--d:8s;--dl:-2s"></i></div>
    <div class="slider" id="slider" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Photos of Ashraf" data-tilt3>
      <div class="track">${slides}</div>
      <button class="arrow l" aria-label="Previous photo">${ic("chev").replace('<svg','<svg style="transform:scaleX(-1)"')}</button>
      <button class="arrow r" aria-label="Next photo">${ic("chev")}</button>
      <a class="slider-over" href="${INSTAGRAM_MAIN}" target="_blank" rel="noopener noreferrer" aria-label="ASHRAF/ARF, ASHRAF/ARF for you CEO - open Instagram">
        <b>ASHRAF/ARF ${ic("arrow")}</b><span>ASHRAF/ARF for you CEO</span>
      </a>
      <div class="sl-ctl">${dots}<button class="pp" aria-label="Pause slideshow">${ic("pause")}</button></div>
    </div>
  </div>`;
}

    <div class="fsoc">${SOCIALS.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer me" aria-label="${s.name}: ${s.handle}" title="${s.name}">${ic(s.id)}</a>`).join("")}</div>
    <div class="copy">&copy; <span id="yr"></span> All Rights Reserved by ARF / ASHRAF</div></div>`;
}

/* ---------- behaviours ---------- */
function reveal(root){
  const els=$$(".rv",root);
  if(RM||!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px",threshold:.08});
  els.forEach(e=>io.observe(e)); cleanups.push(()=>io.disconnect());
}
function tilt(root){
  if(RM) return;
  $$("[data-tilt]",root).forEach(el=>{
    let raf=0,rx=0,ry=0;
    const apply=()=>{raf=0;el.style.transform=`perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg)`};
    const set=()=>{if(!raf)raf=requestAnimationFrame(apply)};
    el.addEventListener("pointermove",e=>{const r=el.getBoundingClientRect();ry=((e.clientX-r.left)/r.width-.5)*9;rx=-((e.clientY-r.top)/r.height-.5)*9;set()});
    ["pointerleave","pointercancel","pointerup"].forEach(t=>el.addEventListener(t,()=>{rx=ry=0;set()}));
  });
}
/* parallax: gentle depth on floating shapes, transform only */
let pxEls=[],pxRaf=0;
function parallax(root){
  pxEls=RM?[]:$$(".float[data-depth]",root);
  pxEls.forEach(el=>el.style.setProperty("--ty","0px"));
  const run=()=>{pxRaf=0;const y=window.scrollY;pxEls.forEach(el=>{const d=parseFloat(el.dataset.depth)||0;const b=el.getBoundingClientRect();if(b.bottom<-200||b.top>innerHeight+200)return;el.style.transform=(el.style.transform.replace(/translate3d\([^)]*\)\s*/,""));el.style.translate=`0 ${(y*d).toFixed(1)}px`})};
  const on=()=>{if(!pxRaf)pxRaf=requestAnimationFrame(run)};
  addEventListener("scroll",on,{passive:true}); on();
  cleanups.push(()=>removeEventListener("scroll",on));
}
function initBio(){
  const btn=$("#bio-btn"); if(!btn) return;
  btn.onclick=()=>{
    const box=$("#bio"),open=!box.classList.contains("open");
    box.classList.toggle("open",open);
    $("#bio-p").textContent=open?BIO_LONG.join(" "):BIO_SHORT;
    $("#bio-more").style.display="none";
    btn.textContent=open?"See Less":"See More"; btn.setAttribute("aria-expanded",open);
    $("#bio-full").hidden=!open;
  };
}
function initSlider(){
  const s=$("#slider"); if(!s) return;
  const track=$(".track",s),n=IMAGES.length,dots=$$(".dot",s),pp=$(".pp",s);
  let i=0,dx=0,sx=0,sy=0,down=false,moved=false,suppress=false,paused=RM,hover=false,w=1;
  const go=k=>{i=(k+n)%n;track.style.transform=`translate3d(${-i*100}%,0,0)`;dots.forEach((d,j)=>d.setAttribute("aria-current",j===i))};
  dots.forEach((d,j)=>d.onclick=()=>go(j));
  $(".arrow.l",s).onclick=()=>go(i-1); $(".arrow.r",s).onclick=()=>go(i+1);
  s.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(i-1);if(e.key==="ArrowRight")go(i+1)});
  const setPP=()=>{pp.innerHTML=ic(paused?"play":"pause");pp.setAttribute("aria-label",paused?"Play slideshow":"Pause slideshow")};
  pp.onclick=()=>{paused=!paused;setPP()}; setPP();
  s.addEventListener("pointerdown",e=>{if(e.target.closest(".dot,.pp,.arrow"))return;down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;w=s.clientWidth;s.dataset.id=e.pointerId});
  s.addEventListener("pointermove",e=>{
    if(!down)return; const mx=e.clientX-sx,my=e.clientY-sy;
    if(!moved){ if(Math.abs(mx)>7&&Math.abs(mx)>Math.abs(my)){moved=true;s.classList.add("dragging");try{s.setPointerCapture(e.pointerId)}catch(_){}} else return }
    dx=mx; track.style.transform=`translate3d(calc(${-i*100}% + ${dx}px),0,0)`;
  });
  const end=()=>{ if(!down)return; down=false; s.classList.remove("dragging");
    if(moved){ suppress=true; setTimeout(()=>suppress=false,60); if(Math.abs(dx)>w*.16) go(dx<0?i+1:i-1); else go(i) } };
  s.addEventListener("pointerup",end); s.addEventListener("pointercancel",end);
  s.addEventListener("click",e=>{if(suppress){e.preventDefault();e.stopPropagation()}},true);
  s.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")hover=true}); s.addEventListener("pointerleave",()=>hover=false);
  s.addEventListener("focusin",()=>hover=true); s.addEventListener("focusout",()=>hover=false);
  const t=setInterval(()=>{if(!paused&&!hover&&!down&&!document.hidden)go(i+1)},4800);
  cleanups.push(()=>clearInterval(t));
  /* subtle 3D tilt of the whole photo frame on desktop pointer */
  if(!RM&&matchMedia("(hover:hover)").matches){
    const box=s.parentElement; let raf=0,rx=0,ry=0;
    const ap=()=>{raf=0;s.style.transform=`perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`};
    box.addEventListener("pointermove",e=>{const r=box.getBoundingClientRect();ry=((e.clientX-r.left)/r.width-.5)*8;rx=-((e.clientY-r.top)/r.height-.5)*8;if(!raf)raf=requestAnimationFrame(ap)});
    box.addEventListener("pointerleave",()=>{rx=ry=0;if(!raf)raf=requestAnimationFrame(ap)});
    s.style.transition="transform .3s ease-out";
  }
}
function initRail(){
  const r=$("#rail"); if(!r) return;
  const step=()=>{const c=r.firstElementChild;return c?c.getBoundingClientRect().width+16:240};
  $("#rp").onclick=()=>r.scrollBy({left:-step(),behavior:RM?"auto":"smooth"});
  $("#rn").onclick=()=>r.scrollBy({left:step(),behavior:RM?"auto":"smooth"});
  r.addEventListener("keydown",e=>{if(e.key==="ArrowRight")$("#rn").click();if(e.key==="ArrowLeft")$("#rp").click()});
  let down=false,sx=0,sl=0,moved=false;
  r.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;moved=false;sx=e.clientX;sl=r.scrollLeft});
  addEventListener("pointermove",mv);
  function mv(e){if(!down)return;const d=e.clientX-sx;if(Math.abs(d)>5){moved=true;r.classList.add("grab")}if(moved)r.scrollLeft=sl-d}
  const up=()=>{if(!down)return;down=false;r.classList.remove("grab")};
  addEventListener("pointerup",up);
  r.addEventListener("click",e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);
  cleanups.push(()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)});
}
function initContact(){
  const f=$("#cform"); if(!f) return;
  let via="wa";
  $$("button[type=submit]",f).forEach(b=>b.addEventListener("click",()=>via=b.dataset.via));
  f.addEventListener("submit",e=>{
    e.preventDefault();
    const d=new FormData(f),name=(d.get("name")||"").trim(),msg=(d.get("msg")||"").trim(),em=(d.get("email")||"").trim(),topic=d.get("topic");
    const st=$("#cstatus");
    if(!name||!msg){st.className="status err";st.textContent="Please add your name and a short message.";return}
    const text=`Hello Ashraf, I'm ${name}.\nTopic: ${topic}\n\n${msg}${em?`\n\nReply to: ${em}`:""}`;
    if(via==="wa"){ window.open(wa(text),"_blank","noopener"); st.textContent="Opening WhatsApp..."; }
    else { location.href=`mailto:${EMAIL}?subject=${encodeURIComponent(topic+" - "+name)}&body=${encodeURIComponent(text)}`; st.textContent="Opening your email app..."; }
    st.className="status ok";
  });
}
/* ---------- ADMIN GATE ---------- */
/* IMPORTANT: this is only a front-end gate. A static website cannot keep anything truly secret,
   and anyone can read this code. Real protection needs a backend sign-in.
   >>> HOOK: replace authenticateAdmin() with a real call, e.g. Firebase Auth / Google Sign-In,
       then verify the signed-in email on the SERVER against an allowlist (only ADMIN_EMAIL),
       and only serve admin data from that server. Never put passwords or secrets in this file. */
async function authenticateAdmin(email){
  return { ok: email.trim().toLowerCase() === ADMIN_EMAIL, backendConnected:false };
}
function initAdmin(){
  const f=$("#aform"); if(!f) return;
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const em=f.email.value.trim(),st=$("#astatus");
    if(!/^\S+@\S+\.\S+$/.test(em)){st.className="status err";st.textContent="Please enter a valid email address.";return}
    const res=await authenticateAdmin(em);
    if(!res.ok){st.className="status err";st.textContent="Access restricted. This area is only for the site owner.";return}
    st.textContent="";
    $("#apanel").hidden=false; f.hidden=true;
    $("#apanel").innerHTML=`<div class="status ok" style="margin-bottom:10px">Email recognised.</div><div class="notice">Secure sign-in is not connected yet. This page is a front-end gate only. A backend login (for example Google sign-in with a server-side allowlist) must be added before any admin tools are shown.</div><div class="row" style="margin-top:14px"><a class="btn btn-gold" href="#/">Back to home</a></div>`;
  });
}

/* ---------- menu ---------- */
const menuList=$("#menu-list");
menuList.innerHTML=NAV.map(n=>`<li><a href="#${n.r}" data-r="${n.r}">${n.label}${n.icon?ic(n.icon):(n.tag?`<small>${n.tag}</small>`:ic("arrow"))}</a></li>`).join("");
const burger=$("#burger"),menu=$("#menu");
function setMenu(open){
  document.body.classList.toggle("menu-open",open); document.body.classList.toggle("lock",open);
  burger.setAttribute("aria-expanded",open); burger.setAttribute("aria-label",open?"Close menu":"Open menu");
  menu.setAttribute("aria-hidden",!open);
  menu.inert=!open; $("#app").inert=open; $("#foot").inert=open;
  if(open) setTimeout(()=>$("#menu a").focus({preventScroll:true}),60); else if(document.activeElement&&menu.contains(document.activeElement)) burger.focus();
}
menu.inert=true;
burger.onclick=()=>setMenu(!document.body.classList.contains("menu-open"));
addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("menu-open")){setMenu(false);burger.focus()}});
menu.addEventListener("click",e=>{if(e.target.closest("a"))setMenu(false)});

/* ---------- router ---------- */
function parse(){
  const h=(location.hash||"#/").replace(/^#/,"")||"/";
  const parts=h.split("/").filter(Boolean);
  if(parts[0]==="blog"&&parts[1]) return {key:"/blog",arg:parts[1],path:"/blog/"+parts[1]};
  const key="/"+(parts[0]||"");
  return V[key]&&key!=="/blog"?{key,path:key}:{key:"404",path:"/404"};
}
let first=true;
function render(){
  cleanups.forEach(f=>f()); cleanups=[];
  const r=parse(), app=$("#app");
  app.innerHTML=`<div class="view">${V[r.key](r.arg)}</div>`;
  const m=META[r.key]||(r.key==="/blog"?[(BLOGS.find(b=>b.id===r.arg)||{}).title+" | ARF","Article by Ashraf / ARF."]:["Page not found | ARF",""]);
  document.title=m[0]; $('meta[name="description"]').content=m[1];
  $$("#menu a").forEach(a=>a.getAttribute("data-r")===r.key?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  scrollTo({top:0,behavior:"instant"});
  if(!first) app.focus({preventScroll:true}); first=false;
  reveal(app); tilt(app); parallax(app); initBio(); initSlider(); initRail(); initContact(); initAdmin();
}
$("#foot").innerHTML=footerHTML(); $("#yr").textContent=new Date().getFullYear();
addEventListener("hashchange",render);
render();
</script>
